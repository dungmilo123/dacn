# Held-out fixed-poison 3-node chain episode driving the generated schema-v1
# calibration artifact (M002/S03/T03 acceptance).
#
# This config is identical to configs/fixed_poison_3node.yaml in every
# non-aggregation field (same seed, topology, data, training, attack, evaluation,
# and trace settings) so the only experimental difference versus
# configs/validation_reference_fixed_poison_3node.yaml is the aggregation
# selector. The acceptance seed 20240101 is distinct from every calibration
# episode seed (M002/S02's schedule derives its own domain-separated seeds).
#
# ``artifact_dir`` is the documented generated-artifact location produced by:
#   dfl calibrate configs/calibrate_chain3.yaml --output runs/bayesian_chain3_artifact
# It must be generated by ``dfl calibrate``; the checked-in S01 hand fixture
# (tests/fixtures/bayesian_v1) is intentionally not accepted here.
seed: 20240101
rounds: 2
device: cpu
bitwise: true

model:
  name: small_cnn

data:
  dataset: mnist
  partition: iid
  samples_per_node: 64
  data_root: data
  download: false

training:
  optimizer: sgd
  learning_rate: 0.05
  batch_size: 16
  local_epochs: 1
  num_workers: 0

topology:
  kind: chain3

attack:
  compromised_node: 0
  intensity: strong

aggregation:
  kind: bayesian
  # Generated artifact directory, relative to the run working directory.
  artifact_dir: runs/bayesian_chain3_artifact
  omega: 0.5
  degree_cap: 4
  tie_tolerance: 1.0e-09

# Bounded privileged post-commit evaluation (R008) and trace cadence (R009).
evaluation:
  max_samples: 512
  batch_size: 64

trace:
  snapshot_cadence: 1
